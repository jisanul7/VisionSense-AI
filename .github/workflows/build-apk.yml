name: Build VisionSense APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project Skeleton
        run: |
          flutter create --org com.visionsense --project-name visionsense_mobile mobile_app
          cd mobile_app
          flutter pub add http url_launcher image_picker flutter_tts

      - name: Enable Android Internet & Query Permissions
        run: |
          # Inject android.permission.INTERNET into AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' mobile_app/android/app/src/main/AndroidManifest.xml
          
          # Allow WhatsApp url_launcher intents on Android 11+
          sed -i '/<\/manifest>/i \    <queries>\n        <package android:name="com.whatsapp" />\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n    </queries>' mobile_app/android/app/src/main/AndroidManifest.xml

      - name: Inject Scanner Code
        run: |
          cat << 'EOF' > mobile_app/lib/main.dart
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:http/http.dart' as http;
          import 'package:url_launcher/url_launcher.dart';
          import 'package:flutter_tts/flutter_tts.dart';

          void main() => runApp(const MaterialApp(home: VisionSenseMobile(), debugShowCheckedModeBanner: false));

          class VisionSenseMobile extends StatefulWidget {
            const VisionSenseMobile({super.key});
            @override
            State<VisionSenseMobile> createState() => _VisionSenseMobileState();
          }

          class _VisionSenseMobileState extends State<VisionSenseMobile> {
            final ImagePicker _picker = ImagePicker();
            final FlutterTts _tts = FlutterTts();
            File? _image;
            String _summary = "Optical sensor ready. Feed photo to scan.";
            List<dynamic> _items = [];
            bool _loading = false;

            Future<void> _sendWhatsApp(String text, {String? phone}) async {
              final enc = Uri.encodeComponent(text);
              final url = (phone != null && phone.isNotEmpty) 
                  ? "https://wa.me/${phone.replaceAll(RegExp(r'[^0-9]'), '')}?text=$enc"
                  : "https://api.whatsapp.com/send?text=$enc";
              await launchUrl(Uri.parse(url), mode: LaunchMode.externalApplication);
            }

            void _showWhatsAppPrompt(String text) {
              final ctrl = TextEditingController();
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF1E293B),
                  title: const Text("Share to WhatsApp", style: TextStyle(color: Colors.white)),
                  content: TextField(
                    controller: ctrl,
                    keyboardType: TextInputType.phone,
                    style: const TextStyle(color: Colors.white),
                    decoration: const InputDecoration(
                      labelText: "Recipient Phone Number (Optional)",
                      labelStyle: TextStyle(color: Colors.cyanAccent),
                      hintText: "919876543210",
                      hintStyle: TextStyle(color: Colors.white30),
                    ),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text("Cancel")),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF25D366)),
                      onPressed: () {
                        Navigator.pop(ctx);
                        _sendWhatsApp(text, phone: ctrl.text);
                      },
                      child: const Text("Send", style: TextStyle(color: Colors.white)),
                    ),
                  ],
                ),
              );
            }

            Future<void> _scan(ImageSource src) async {
              final picked = await _picker.pickImage(source: src);
              if (picked == null) return;
              setState(() { _image = File(picked.path); _loading = true; _items = []; _summary = "Analyzing image via Cloud..."; });

              try {
                final req = http.MultipartRequest('POST', Uri.parse("https://visionsense-ai-1.onrender.com/analyze"));
                req.files.add(await http.MultipartFile.fromPath('file', picked.path));
                final res = await http.Response.fromStream(await req.send().timeout(const Duration(seconds: 120)));
                if (res.statusCode == 200) {
                  final data = jsonDecode(res.body);
                  setState(() {
                    _summary = data['summary'] ?? "Scan complete.";
                    _items = data['items'] ?? [];
                  });
                } else {
                  setState(() => _summary = "Error ${res.statusCode}: Failed to analyze.");
                }
              } catch (e) {
                setState(() => _summary = "Network Error: $e");
              } finally {
                setState(() => _loading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0F172A),
                appBar: AppBar(
                  backgroundColor: const Color(0xFF1E293B),
                  title: const Text("VisionSense AI", style: TextStyle(color: Colors.cyanAccent)),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.share, color: Color(0xFF25D366)),
                      tooltip: "Send summary to WhatsApp",
                      onPressed: () => _showWhatsAppPrompt("VisionSense Scan:\n$_summary"),
                    ),
                    IconButton(
                      icon: const Icon(Icons.volume_up, color: Colors.cyanAccent),
                      onPressed: () => _tts.speak(_summary),
                    )
                  ],
                ),
                body: Column(
                  children: [
                    if (_image != null) SizedBox(height: 200, width: double.infinity, child: Image.file(_image!, fit: BoxFit.cover)),
                    Padding(
                      padding: const EdgeInsets.all(12),
                      child: Container(
                        padding: const EdgeInsets.all(12),
                        decoration: BoxDecoration(color: const Color(0xFF1E293B), borderRadius: BorderRadius.circular(8)),
                        child: Text(_summary, style: const TextStyle(color: Colors.white)),
                      ),
                    ),
                    if (_loading) const LinearProgressIndicator(color: Colors.cyanAccent),
                    Expanded(
                      child: ListView.builder(
                        itemCount: _items.length,
                        itemBuilder: (ctx, i) {
                          final it = _items[i];
                          return Card(
                            color: const Color(0xFF1E293B),
                            margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                            child: ListTile(
                              title: Text(it['label'] ?? '', style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                              subtitle: Text(it['insights'] ?? '', style: const TextStyle(color: Colors.white70)),
                              trailing: IconButton(
                                icon: const Icon(Icons.send, color: Color(0xFF25D366)),
                                onPressed: () => _showWhatsAppPrompt("VisionSense Detection:\nItem: ${it['label']}\nColor: ${it['color']}\nInsight: ${it['insights']}"),
                              ),
                            ),
                          );
                        },
                      ),
                    )
                  ],
                ),
                bottomNavigationBar: Container(
                  padding: const EdgeInsets.all(12),
                  color: const Color(0xFF1E293B),
                  child: Row(
                    children: [
                      Expanded(
                        child: ElevatedButton.icon(
                          style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF10B981)),
                          onPressed: () => _scan(ImageSource.camera),
                          icon: const Icon(Icons.camera_alt, color: Colors.white),
                          label: const Text("Camera", style: TextStyle(color: Colors.white)),
                        ),
                      ),
                      const SizedBox(width: 8),
                      Expanded(
                        child: ElevatedButton.icon(
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent),
                          onPressed: () => _scan(ImageSource.gallery),
                          icon: const Icon(Icons.photo_library, color: Colors.white),
                          label: const Text("Gallery", style: TextStyle(color: Colors.white)),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build Standalone APK
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionSense-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
